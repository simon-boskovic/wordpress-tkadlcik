# Dress rehearsal of the Webglobe migration (docs/deploy.md): a stack with the production host's versions (PHP 8.2,
# MySQL 5.6.51, Apache with .htaccess). build/rehearsal.sh installs a plain WordPress in it (the client's existing
# site), then runs the bundle's deploy/webglobe/ scripts exactly as on the server, rollback included.
#
#   ./build/rehearsal.sh            bundle -> existing site -> 00, 01, 02, 03 -> checks -> 09 -> 02, 03
#   ./build/rehearsal.sh --down     remove the stack and its volumes
#
# Site: http://localhost:8030 (separate project name, volumes and port; the main stack on :8020 is untouched).
name: tkadlcik-rehearsal

x-db-env: &db-env
  WORDPRESS_DB_HOST: db:3306
  WORDPRESS_DB_NAME: wordpress
  WORDPRESS_DB_USER: wordpress
  WORDPRESS_DB_PASSWORD: wordpress
  WORDPRESS_DB_CHARSET: utf8
  WORDPRESS_TABLE_PREFIX: wp_

# Only what the rehearsal itself needs: the migration (02-migrace.sh) writes WP_ENVIRONMENT_TYPE, WP_CACHE,
# DISALLOW_FILE_EDIT and WP_MEMORY_LIMIT into wp-config.php like on the server. The debug log catches PHP notices;
# TK_PAGE_CACHE_CONNECT_TO lets cache-warm in the CLI container reach the site (Webglobe reaches its own domain).
x-wp-config-extra: &wp-config-extra |
  define( 'WP_DEBUG_LOG', true );
  define( 'WP_DEBUG_DISPLAY', false );
  define( 'FS_METHOD', 'direct' );
  define( 'TK_PAGE_CACHE_CONNECT_TO', 'wordpress:80' );

services:
  db:
    image: mysql:5.6.51
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_520_ci", "--max-allowed-packet=64M"]
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -ppassword --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  wordpress:
    image: wordpress:7.1-php8.2-apache
    depends_on:
      db:
        condition: service_healthy
    # mod_headers/mod_expires/mod_brotli: the image ships them disabled. Brotli stands in for the server compression (ask Webglobe, go-live #1).
    command: ["bash", "-c", "a2enmod headers expires brotli >/dev/null && echo 'AddOutputFilterByType BROTLI_COMPRESS text/html text/plain text/css text/javascript application/javascript application/json image/svg+xml' > /etc/apache2/conf-enabled/zz-br.conf && exec docker-entrypoint.sh apache2-foreground"]
    ports:
      - '127.0.0.1:8030:80'
    environment:
      <<: *db-env
      WORDPRESS_CONFIG_EXTRA: *wp-config-extra
    volumes:
      - web:/var/www/html

  # The "server console": WP-CLI with PHP 8.2; /deploy = $D on Webglobe (bundle in /deploy/bundle, backups in /deploy/backup).
  wpcli:
    image: wordpress:cli-php8.2
    profiles: [cli]
    depends_on:
      db:
        condition: service_healthy
    user: "33:33"
    working_dir: /deploy
    environment:
      <<: *db-env
      WORDPRESS_CONFIG_EXTRA: *wp-config-extra
    volumes:
      - web:/var/www/html
      - ../../backups/rehearsal:/deploy
    entrypoint: ["sh"]

volumes:
  db_data:
  web:
